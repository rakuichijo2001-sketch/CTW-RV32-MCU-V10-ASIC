project:
  title: "CTW RV32 MCU V10"
  author: "CTW"
  discord: ""
  description: "TinyQV MCU with external Flash, dual PSRAM, UART, programmable bidirectional GPIO, GPIO/timer/UART interrupts, PWM, I2C master, pinmux, watchdog and stress-test firmware"
  language: "Verilog"
  clock_hz: 20000000
  tiles: "3x2"
  top_module: "tt_um_ctw_rv32_mcu"
  source_files:
    - "alu.v"
    - "core.v"
    - "counter.v"
    - "cpu.v"
    - "ctw_mcu.v"
    - "ctw_mcu_pads.v"
    - "ctw_qspi_boot.v"
    - "ctw_uart.v"
    - "ctw_pwm.v"
    - "ctw_i2c_master.v"
    - "ctw_sys_watchdog.v"
    - "decode.v"
    - "hasemi_mem_ctrl_stream.v"
    - "hasemi_tinyqv_pio.v"
    - "qspi_ctrl.v"
    - "register.v"
    - "tt_um_ctw_rv32_mcu.v"

pinout:
  ui[0]: "GPIO0"
  ui[1]: "GPIO1"
  ui[2]: "GPIO2"
  ui[3]: "GPIO3"
  ui[4]: "GPIO4 / Sensor D0"
  ui[5]: "GPIO5 / Sensor D1"
  ui[6]: "GPIO6 / Sensor D2"
  ui[7]: "UART RX"
  uo[0]: "GPIO0"
  uo[1]: "GPIO1"
  uo[2]: "GPIO2"
  uo[3]: "GPIO3 / PWM0"
  uo[4]: "GPIO4 / PWM1"
  uo[5]: "PSRAM A CS#"
  uo[6]: "PSRAM B CS#"
  uo[7]: "UART TX"
  uio[0]: "Flash CS#"
  uio[1]: "DQ0"
  uio[2]: "DQ1"
  uio[3]: "SCK"
  uio[4]: "DQ2"
  uio[5]: "DQ3"
  uio[6]: "GPIO bidirectional / I2C SDA (open-drain)"
  uio[7]: "GPIO bidirectional / I2C SCL (open-drain)"

yaml_version: 6
