name: debug-irq-asic-40mhz
on: [push, workflow_dispatch]
jobs:
  model:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run timed-PSRAM IRQ regression with boot/PC trace
        run: make test-irq-asic
