name: test
on: [push, workflow_dispatch]
jobs:
  model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y iverilog yosys
      - run: make test test-ram-guard test-timing test-sensor-asic test-sensor-pc test-pinout gate gate-irq test-v10-watchdog test-v9-rtl test-v10-python
