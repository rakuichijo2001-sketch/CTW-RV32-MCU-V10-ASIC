name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttsky26d
        with:
          pdk: sky130A

      - name: Enforce 30 MHz physical signoff at all corners
        run: python3 asic/check_30mhz_signoff.py --reports runs/wokwi

      # Best effort to preserve design reports on failures and cancellation.
      - name: Preserve PNR diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pnr_diagnostics
          retention-days: 14
          if-no-files-found: ignore
          path: |
            runs/wokwi/**/*.log
            runs/wokwi/**/*.rpt
            runs/wokwi/**/or_metrics_out.json
            runs/wokwi/**/state_out.json
            runs/wokwi/**/runtime.txt
            runs/wokwi/**/*.def

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26d

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26d

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttsky26d
